[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdzapi"
version = "1.1.0"
description = "Universal synchronous and asynchronous Python client for 9 GDZ providers (GDZ.ru, Euroki, MegaResheba, Raketa, Reshak, Pomogalka, Skysmart, GDZ-Putina, GDZ.ltd)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "maybewewill" }
]
keywords = [
    "gdz", "gdzapi", "resheba", "megaresheba", "euroki", "reshak",
    "pomogalka", "raketa", "skysmart", "putina", "gdz-putina", "gdz-ltd",
    "api", "scraper", "asyncio", "education", "homework", "solutions"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/maybewewill/gdzAPI"
Repository = "https://github.com/maybewewill/gdzAPI"
Issues = "https://github.com/maybewewill/gdzAPI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdzapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: marks tests as requiring live internet access"
]
